<!DOCTYPE html>
<html>
<head>
	{% include site-head.html title=page.title %}
	<link rel="stylesheet" href="/css/blog.css">
</head>

<body>

	{% include site-header.html %}

	<div class="main-content blog-layout">

		<aside class="blog-sidebar" id="blog-sidebar"></aside>

		<article class="blog-post">
			<h1>{{ page.title }}</h1>
			<div class="post-meta">
				<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
				{% if page.tags and page.tags.size > 0 %}
					<span class="post-tags">
						{% for tag in page.tags %}<span class="tag-pill">{{ tag }}</span>{% endfor %}
					</span>
				{% endif %}
			</div>

			{{ content }}
		</article>

	</div>

	<script src="/blog/blog.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			Blog.renderSidebar('#blog-sidebar');
		});
	</script>
</body>
</html>
