<!DOCTYPE html>
<html>
<head>
	{% include site-head.html title=page.title %}
	<link rel="stylesheet" href="/css/blog.css">
</head>

<body>

	{% include site-header.html %}

	<div class="main-content blog-layout">

		<aside class="blog-sidebar" id="blog-sidebar"></aside>

		<div class="blog-archive">
			<h1>{{ page.title }}</h1>
			{{ content }}
			<div id="blog-archive-list"></div>
		</div>

	</div>

	<script src="/blog/blog.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			Blog.renderSidebar('#blog-sidebar');
			Blog.renderArchive('#blog-archive-list');
		});
	</script>
</body>
</html>
